<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дыхание">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Дыхание</title>
<style>
:root{
  --bg:#0a0e13; --surface:#131920; --surface2:#1b232d; --text:#f3f0e7; --muted:#8d98a5; --line:#243040;
  --t1:#2fd3c0; --t2:#2b7fe0;
  --accent:var(--t1); --accent-text:var(--t1); --accent-ink:#fff; --accent-soft:color-mix(in srgb,var(--t1) 16%,transparent);
  --ok:#4cd08f; --warn:#ffb057; --danger:#ff6b6b;
  --inhale:#2fd3c0; --hold:#9b7bff; --exhale:#3a8ef0; --pause:#6f7f95; --pump:#ff8a2c; --rest:#4fbf86;
  --shadow:0 10px 30px rgba(0,0,0,.35); --radius:22px;
}
:root[data-theme="light"]{
  --bg:#f5efe2; --surface:#fffdf8; --surface2:#ece4d3; --text:#17201b; --muted:#6b746d; --line:#e0d7c3;
  --accent-text:color-mix(in srgb,var(--t1) 55%,#000);
  --ok:#1f8f5c; --warn:#c26a12; --danger:#cf3f3f; --shadow:0 10px 30px rgba(70,55,20,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(104px + env(safe-area-inset-bottom));overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20% -20% auto -20%;height:60vh;background:radial-gradient(ellipse at 30% 0%,color-mix(in srgb,var(--t1) 22%,transparent),transparent 60%),radial-gradient(ellipse at 90% 10%,color-mix(in srgb,var(--t2) 18%,transparent),transparent 55%);pointer-events:none;z-index:0;transition:background .6s}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.02rem;font-weight:700}
p{margin:.4em 0 .8em}
a{color:var(--accent-text)}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;position:relative;z-index:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:0 0 14px;box-shadow:var(--shadow)}
.muted{color:var(--muted)} .small{font-size:.875rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between}
.sec{margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec a{font-size:.85rem;font-weight:600;text-decoration:none}
.page-title{margin:6px 2px 16px}
.pill{display:inline-block;padding:4px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-size:.78rem;font-weight:700}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.dim{background:var(--surface2);color:var(--muted)}
.btn{appearance:none;border:0;border-radius:16px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--surface2);color:var(--text);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.96);filter:brightness(1.1)}
.btn.primary{background:linear-gradient(135deg,var(--t1),var(--t2));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);box-shadow:0 8px 22px color-mix(in srgb,var(--t2) 40%,transparent)}
.btn.danger{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.banner{border-radius:18px;padding:12px 14px;margin:0 0 14px;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.banner .x{margin-left:auto;background:none;border:0;color:inherit;font-size:1.2rem;cursor:pointer;line-height:1}
ol.steps{padding-left:1.2em;margin:.3em 0} ol.steps li{margin:.25em 0}

/* views */
section.view{display:none}
section.view.active{display:block;animation:viewIn .32s ease-out both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* home */
.hello{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 2px 16px}
.hello h1{margin:0}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font:inherit;font-weight:800;font-size:.9rem;color:var(--text);cursor:pointer}
.chip.fire{background:color-mix(in srgb,#ff7a2c 16%,var(--surface));border-color:color-mix(in srgb,#ff7a2c 40%,transparent);color:#ff9a4c}
.chip.med{background:color-mix(in srgb,#ffd25a 14%,var(--surface));border-color:color-mix(in srgb,#ffd25a 40%,transparent);color:#e8b430}
.goal{display:flex;gap:14px;align-items:center;padding:14px 16px}
.goal svg{width:62px;height:62px;flex:none}
.goal .gt{font-weight:800}
.week{display:flex;justify-content:space-between;gap:4px;margin:-4px 0 14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.7rem;color:var(--muted);font-weight:600;flex:1}
.wd i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.8rem;color:transparent}
.wd.done i{background:linear-gradient(135deg,var(--t1),var(--t2));border-color:transparent;color:#fff;box-shadow:0 0 12px color-mix(in srgb,var(--t1) 50%,transparent)}
.wd.today{color:var(--text)} .wd.today i{border-color:var(--t1)}
.wd.future{opacity:.45}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px;margin:0 0 14px;color:#f6f3ea;
  background:radial-gradient(circle at 88% 12%,color-mix(in srgb,var(--t1) 70%,transparent),transparent 46%),radial-gradient(circle at 100% 100%,color-mix(in srgb,var(--t2) 75%,transparent),transparent 60%),linear-gradient(160deg,#16202b,#0c1117);
  box-shadow:0 18px 44px color-mix(in srgb,var(--t2) 28%,transparent);border:1px solid color-mix(in srgb,var(--t1) 30%,transparent)}
.hero .art{position:absolute;right:-18px;top:-14px;width:170px;height:170px;opacity:.95;filter:drop-shadow(0 8px 24px rgba(0,0,0,.4));animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(8px) rotate(4deg)}}
.hero .badge{display:inline-block;background:#f6f3ea;color:#0c1117;font-size:.68rem;font-weight:800;letter-spacing:.08em;padding:3px 9px;border-radius:999px}
.hero h2{font-size:1.6rem;margin:76px 0 2px;position:relative}
.hero .lv{opacity:.85;font-weight:600;position:relative}
.hero .rhythm{font-size:2rem;font-weight:800;letter-spacing:.01em;margin:10px 0 0;position:relative}
.hero .legend{opacity:.7;font-size:.8rem;position:relative}
.hero .go{width:100%;margin-top:16px;padding:16px;border-radius:18px;background:#f6f3ea;color:#0c1117;font-size:1.08rem;font-weight:800;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pulseBtn 2.6s ease-in-out infinite}
@keyframes pulseBtn{0%,100%{box-shadow:0 8px 24px rgba(0,0,0,.35),0 0 0 0 rgba(246,243,234,.45)}50%{box-shadow:0 8px 24px rgba(0,0,0,.35),0 0 0 10px rgba(246,243,234,0)}}
.hero .meta{display:flex;justify-content:space-between;font-size:.82rem;margin-top:10px;opacity:.85;position:relative}
.hero .meta a{color:#f6f3ea}
.status{font-size:.9rem;margin:0 4px 6px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 8px;margin:0 -16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.tcard{flex:none;width:150px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;cursor:pointer;font:inherit;color:inherit;text-align:left}
.tcard .tile{aspect-ratio:1.25;border-radius:14px;background:#1a222c;display:grid;place-items:center;margin-bottom:10px;position:relative;overflow:hidden}
:root[data-theme="light"] .tcard .tile{background:#202a35}
.tcard .tile svg{width:64%;height:auto}
.tcard.cur{border-color:color-mix(in srgb,var(--t1) 60%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--t1) 25%,transparent)}
.tcard.lock .tile svg{filter:grayscale(1);opacity:.35}
.tcard .lk{position:absolute;right:8px;top:8px;font-size:.9rem}
.tcard b{display:block;font-size:.92rem;line-height:1.2}
.tcard span{font-size:.76rem;color:var(--muted)}
.recent{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 8px;margin:0 -16px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.recent svg{width:64px;height:64px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
nav.tabs .in{pointer-events:auto;display:flex;align-items:center;max-width:540px;margin:0 auto;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 12px 34px rgba(0,0,0,.4)}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:.68rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;cursor:pointer;border-radius:18px;transition:color .2s,transform .12s}
nav.tabs button:active{transform:scale(.92)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.active{color:var(--accent-text)}
nav.tabs button.fab{flex:none;width:64px;height:64px;border-radius:50%;margin:-26px 6px 0;background:linear-gradient(135deg,var(--t1),var(--t2));color:#fff;box-shadow:0 10px 26px color-mix(in srgb,var(--t2) 55%,transparent),0 0 0 5px var(--bg);justify-content:center;font-size:0}
nav.tabs button.fab svg{width:30px;height:30px}
nav.tabs button.fab.active{color:#fff}

/* progress */
.path{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.path::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c1) 35%,transparent),transparent 70%)}
.path .hd{display:flex;align-items:center;gap:12px;position:relative}
.path .hd svg{width:46px;height:46px;flex:none}
.path .hd b{font-size:1.05rem}
.path svg.trail{width:100%;max-width:360px;display:block;margin:6px auto 0}
.path .pulse{animation:nodePulse 1.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes nodePulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.5);opacity:0}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface2);border-radius:18px;padding:14px}
.stat b{display:block;font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,var(--t1),var(--t2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.hist li:last-child{border-bottom:0}

/* medals */
.mhead{display:flex;align-items:center;gap:14px}
.mhead .big{font-size:2.4rem;font-weight:800;line-height:1;background:linear-gradient(135deg,#ffe08a,#e8962a);-webkit-background-clip:text;background-clip:text;color:transparent}
.mbar{height:8px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:8px}
.mbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#ffe08a,#e8962a)}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}
.medal{background:none;border:0;color:inherit;font:inherit;text-align:center;cursor:pointer;padding:4px 2px;border-radius:14px;position:relative;transition:transform .15s}
.medal:active{transform:scale(.93)}
.medal svg{width:100%;max-width:104px;height:auto;display:block;margin:0 auto 6px}
.medal:not(.locked) svg{filter:drop-shadow(0 0 14px color-mix(in srgb,var(--glow,#ffd25a) 55%,transparent)) drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.medal.locked svg{filter:grayscale(1);opacity:.28}
.medal .nm{font-size:.78rem;font-weight:700;line-height:1.2}
.medal.locked .nm{color:var(--muted)}
.medal .pg{height:5px;border-radius:4px;background:var(--surface2);margin:6px 14% 2px;overflow:hidden}
.medal .pg i{display:block;height:100%;background:linear-gradient(90deg,var(--t1),var(--t2));border-radius:4px}
.medal .pt{font-size:.68rem;color:var(--muted)}
.medal .cnt{position:absolute;top:0;right:8%;background:linear-gradient(135deg,var(--t1),var(--t2));color:#fff;border-radius:999px;font-size:.72rem;font-weight:800;padding:1px 7px}

/* theory */
details{border:1px solid var(--line);border-radius:18px;background:var(--surface);margin:0 0 10px}
details>summary{cursor:pointer;padding:15px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-size:1.3rem;color:var(--accent-text);flex:none}
details[open]>summary::after{content:"–"}
details .body{padding:0 16px 14px}
details .body ul,details .body ol{padding-left:1.2em}
.tag{font-size:.75rem;color:var(--muted);font-weight:500}

/* settings */
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field.col{flex-direction:column;align-items:stretch;gap:8px}
.seg.wide button{flex:1}
.seg button{white-space:nowrap}
.field>span:first-child{min-width:0}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:3px}
.seg button{border:0;background:none;font:inherit;padding:7px 12px;border-radius:11px;cursor:pointer;color:var(--muted);font-size:.9rem}
.seg button.on{background:linear-gradient(135deg,var(--t1),var(--t2));color:#fff;font-weight:700}
input[type=number],input[type=time]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--text);width:96px;color-scheme:dark}
:root[data-theme="light"] input{color-scheme:light}
input[type=time]{width:140px}
input[type=range]{width:140px;accent-color:var(--t1)}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--surface2);border:1px solid var(--line);border-radius:999px;transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.switch input:checked+span{background:linear-gradient(135deg,var(--t1),var(--t2));border-color:transparent}
.switch input:checked+span::after{transform:translateX(20px)}
.times{display:flex;flex-direction:column;gap:8px;margin-top:8px}

/* session */
#session{position:fixed;inset:0;background:#070a0e;color:#f3f0e7;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));overflow:hidden}
#session.on{display:flex;animation:viewIn .35s ease-out both}
#session .glow{position:absolute;left:50%;top:44%;width:120vmax;height:120vmax;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--orb,var(--inhale)) 0%,transparent 60%);opacity:.34;transition:opacity .8s;pointer-events:none}
#session>*:not(.glow){position:relative}
#session .top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center}
#sTech{background:rgba(255,255,255,.12);color:#f3f0e7}
#sProgress{font-size:.9rem;opacity:.8;font-variant-numeric:tabular-nums}
#session .mid{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
#session .stage{position:relative;width:min(84vw,360px,48vh);aspect-ratio:1;display:grid;place-items:center}
.ringc{position:absolute;border-radius:50%;background:var(--orb,var(--inhale));will-change:transform;transition:background-color .7s}
#ring3{inset:0;opacity:.10}
#ring2{inset:11%;opacity:.16}
#orb{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.5),transparent 55%),var(--orb,var(--inhale));box-shadow:0 0 70px var(--orb,var(--inhale));will-change:transform;transition:background-color .7s,box-shadow .7s}
#session .center{position:relative;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.45);pointer-events:none}
#phaseLabel{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
#orbNum{font-size:3.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;min-height:1em}
#phaseSub{opacity:.75;text-align:center;min-height:1.5em;font-size:.95rem}
.nostrils[hidden]{display:none}
.nostrils{display:flex;gap:28px;justify-content:center;min-height:58px}
.nos{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;opacity:.8}
.nos i{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:block;transition:.25s}
.nos.on i{background:var(--inhale);border-color:var(--inhale);box-shadow:0 0 16px var(--inhale)}
.nos.on.ex i{background:var(--exhale);border-color:var(--exhale);box-shadow:0 0 16px var(--exhale)}
.nos.off i{border-style:dashed;opacity:.5}
#session .bottom{width:100%;max-width:520px}
.sbar{height:5px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;margin-bottom:16px}
.sbar i{display:block;height:100%;width:0;border-radius:4px;background:#f3f0e7}
#session .controls{display:flex;gap:10px}
#session .controls .btn{flex:1;background:rgba(255,255,255,.12);color:#f3f0e7;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#session .controls .btn.danger{background:rgba(255,107,107,.18);color:#ff9a9a}

/* modal, toast, coin, confetti, onboarding */
#modal{position:fixed;inset:0;background:rgba(3,5,10,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:28px;max-width:440px;width:100%;max-height:88vh;overflow:auto;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.5);text-align:center;animation:boxIn .35s cubic-bezier(.2,1.3,.4,1) both}
@keyframes boxIn{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:none}}
#modal .box svg.medal-svg{width:130px;height:130px}
#modal .box .done-ic{width:74px;height:74px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:2rem;color:#fff;background:linear-gradient(135deg,var(--t1),var(--t2));box-shadow:0 10px 30px color-mix(in srgb,var(--t2) 50%,transparent)}
.newmedals{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:12px 0}
.newmedals div{width:120px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:.9rem;font-weight:600;z-index:70;opacity:0;pointer-events:none;transition:opacity .3s;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
.coin3d{perspective:700px;display:inline-block;cursor:pointer;margin:4px auto}
.coin3d .coin{position:relative;width:150px;height:150px;transform-style:preserve-3d}
.coin3d.sm .coin{width:96px;height:96px}
.coin3d .coin.spin{animation:coinSpin 1.8s cubic-bezier(.3,.7,.3,1) both}
@keyframes coinSpin{0%{transform:scale(.45) rotateY(0)}30%{transform:scale(1.18) rotateY(90deg)}100%{transform:scale(1) rotateY(360deg)}}
.coin3d .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.coin3d .face svg{width:100%;height:100%;display:block}
.coin3d .edge{position:absolute;inset:2%;border-radius:50%;background:linear-gradient(90deg,#7c5810,#e8c25a 45%,#fff0b0 50%,#c9952f 60%,#6b4a0c)}
.coin3d .back{transform:rotateY(180deg) translateZ(6px)}
.coin3d .front{transform:translateZ(6px)}
#confetti{position:fixed;inset:0;z-index:80;pointer-events:none}
#onb{position:fixed;inset:0;z-index:90;background:#070a0e;color:#f3f0e7;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) 24px calc(26px + env(safe-area-inset-bottom));overflow:hidden}
#onb .bgl{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--oc,#2fd3c0) 40%,transparent),transparent 62%);transition:background .6s;pointer-events:none}
#onb>*:not(.bgl){position:relative}
#onb .skip{align-self:flex-end;background:none;border:0;color:#f3f0e7;opacity:.7;font:inherit;cursor:pointer;padding:8px}
#onb .slide{text-align:center;max-width:380px;animation:viewIn .4s ease-out both}
#onb .art{height:220px;display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:26px}
#onb .art .o{position:absolute;border-radius:50%;background:#2fd3c0;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.7)}50%{transform:scale(1)}}
#onb h2{font-size:1.9rem;margin-bottom:10px}
#onb p{opacity:.8;font-size:1.05rem}
#onb .dotsn{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
#onb .dotsn i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);transition:.3s}
#onb .dotsn i.on{width:26px;background:#f3f0e7}
#onb .next{width:100%;max-width:380px;padding:17px;border-radius:18px;border:0;font:inherit;font-weight:800;font-size:1.08rem;background:#f3f0e7;color:#0c1117;cursor:pointer}
#onb .ft{width:100%;display:flex;flex-direction:column;align-items:center}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

<main class="wrap">

<nav class="tabs">

<div id="session" role="dialog" aria-label="Сессия дыхания">

<script>
(function(){
'use strict';

/* ================= ДАННЫЕ ================= */

    fmt:l=>`${l[0]} × 1 в ${String(l[1]).replace('.',',')} с`,
    how:['Сядьте ровно, сделайте глубокий вдох.','Резкий короткий выдох носом за счёт толчка живота внутрь.','Вдох происходит сам, пассивно — не втягивайте воздух.','Плечи и грудь неподвижны, лицо расслаблено.','После раунда — 30 секунд спокойного дыхания.'] }

const LEVELS_PER_TECH = 5, DAYS_NEEDED = 7, WINDOW = 14;

  {id:'dragon',   name:'Внутренний огонь',         cond:'Освоить капалабхати (все 5 уровней)',             c1:'#ffa47e', c2:'#a3202c'},
  {id:'whale',    name:'Глубокое дыхание',         cond:'Одна сессия длительностью 10 минут и больше',     c1:'#8fdcec', c2:'#164f78'},
  {id:'phoenix',  name:'Возрождение',              cond:'Вернуться к практике после сброса счётчика',      c1:'#ffcf7a', c2:'#d43a26'},

/* ================= ХРАНЕНИЕ ================= */

  medals:{}, pendingPhoenix:false, history:[], notice:null, finished:false};
const DEF_SET = {mode:'cycles', cycles:3, minutes:3, phaseSound:true, metro:'click', volume:0.6, remindersOn:false, reminders:['08:00','20:00'], theme:'dark', onboarded:false};
function load(k,def){ try{ const v=JSON.parse(localStorage.getItem(k)); return v?Object.assign(structuredClone(def),v):structuredClone(def);}catch(e){return structuredClone(def);} }
function save(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
let S = load(LS_STATE, DEF_STATE);
let SET = load(LS_SET, DEF_SET);
const saveS=()=>save(LS_STATE,S), saveSet=()=>save(LS_SET,SET);

/* ================= ДАТЫ ================= */
const BW = window.BW = {now:null, speed:1};
const nowDate = ()=> BW.now ? new Date(BW.now) : new Date();
const keyOf = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = ()=> keyOf(nowDate());
function utc(k){const [y,m,d]=k.split('-').map(Number);return Date.UTC(y,m-1,d);}
const diff=(a,b)=>Math.round((utc(b)-utc(a))/864e5);
function addDays(k,n){return new Date(utc(k)+n*864e5).toISOString().slice(0,10);}
function fmtDate(k){const [y,m,d]=k.split('-');return `${d}.${m}.${y}`;}
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c);};

/* ================= ЛОГИКА ПРОГРЕССА ================= */
function evaluate(t){
  if(!S.levelDays.length) return {ok:true};
  const last=S.levelDays[S.levelDays.length-1];
  const skipped=diff(last,t)-1;
  if(skipped>=2) return {ok:false, reason:`пропущено ${skipped} ${plural(skipped,'день','дня','дней')} подряд (можно не больше 1)`};
  const need=DAYS_NEEDED-S.levelDays.length;
  const windowEnd=addDays(S.levelStart,WINDOW-1);
  const avail = (last===t) ? diff(t,windowEnd) : diff(t,windowEnd)+1;
  if(need>0 && avail<need) return {ok:false, reason:'за 14 дней не набирается 7 дней практики'};
  return {ok:true};
}
function applyEvaluation(t){
  const r=evaluate(t);
  if(!r.ok){
    const lvl=`${TECH[S.tech].name}, уровень ${S.level+1}`;
    S.notice={date:t, text:`Счётчик дней обнулён: ${r.reason}. Уровень сохранён (${lvl}) — начните отсчёт 7 дней заново.`};
    S.levelDays=[]; S.levelStart=null; S.pendingPhoenix=true;
    saveS();
  }
}
function streakEnding(t){const set=new Set(S.allDays);let n=0,k=t;while(set.has(k)){n++;k=addDays(k,-1);}return n;}
function bestStreak(){let best=0,cur=0,prev=null;for(const k of [...S.allDays].sort()){cur=(prev&&diff(prev,k)===1)?cur+1:1;best=Math.max(best,cur);prev=k;}return best;}
function currentStreak(){const t=today();return streakEnding(t)||streakEnding(addDays(t,-1));}

function completeSession(durSec, startHour){
  const t=today();
  applyEvaluation(t);
  const fresh=[]; let levelUp=null;
  const award=id=>{
    if(!S.medals[id]){S.medals[id]={first:t,count:1};fresh.push(id);}
    else if(id==='star'){S.medals[id].count++;fresh.push(id);}
  };
  S.sessions++;
  if(!S.allDays.includes(t)){S.allDays.push(t);S.allDays.sort();}
  S.history.unshift({date:t, tech:S.tech, level:S.level, dur:Math.round(durSec), ts:nowDate().getTime()});
  S.history=S.history.slice(0,300);
  award('first');
  if(S.pendingPhoenix){award('phoenix');S.pendingPhoenix=false;}
  let dayCounted=false;
  if(!S.finished && !S.levelDays.includes(t)){
    if(!S.levelDays.length) S.levelStart=t;
    S.levelDays.push(t); dayCounted=true;
  }
  if(!S.finished && S.levelDays.length>=DAYS_NEEDED){
    levelUp={fromTech:S.tech, fromLevel:S.level};
    award('star');
    if(S.level<LEVELS_PER_TECH-1){S.level++;}
    else{
      award(MASTERY[S.tech]);
      if(S.tech<TECH.length-1){S.tech++;S.level=0;levelUp.newTech=true;}
      else{S.finished=true;levelUp.all=true;}
    }
    S.levelDays=[];S.levelStart=null;
  }
  const st=streakEnding(t);
  if(st>=7) award('panther');
  if(st>=14) award('wolf');
  if(S.allDays.length>=30) award('elephant');
  if(S.sessions>=100) award('lion');
  if(startHour<8) award('lark');
  if(startHour>=22) award('owl');
  if(durSec>=600) award('whale');
  saveS();
  return {fresh, levelUp, dayCounted};
}

function star(cx,cy,ro,ri,n,fill,extra=''){
  let p=[];for(let i=0;i<n*2;i++){const r=i%2?ri:ro,a=-Math.PI/2+i*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}
  return `<polygon points="${p.join(' ')}" fill="${fill}" ${extra}/>`;
}

let AC=null;
// iPhone в беззвучном режиме глушит звук страницы. Переводим звук в режим «воспроизведение»:
// через audioSession (новые iOS) или через тихий зацикленный аудио-элемент (старые iOS).
let keepEl=null, keepT=null;
function silentWavURL(){const n=4000,b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i);};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));}
function playbackMode(on){
  try{
    if(navigator.audioSession){ navigator.audioSession.type = on ? 'playback' : 'auto'; return; }
    clearTimeout(keepT);
    if(on){ if(!keepEl){keepEl=new Audio(silentWavURL());keepEl.loop=true;keepEl.setAttribute('playsinline','');} const pr=keepEl.play(); if(pr&&pr.catch)pr.catch(()=>{}); }
    else if(keepEl){ keepT=setTimeout(()=>{try{keepEl.pause();}catch(e){}},4000); }
  }catch(e){}
}
function ensureAudio(){
  try{
    playbackMode(true);
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='running') return Promise.resolve(true);
    const r=AC.resume();
    return Promise.race([Promise.resolve(r).then(()=>AC.state==='running'), new Promise(ok=>setTimeout(()=>ok(AC.state==='running'),1500))]).catch(()=>false);
  }catch(e){return Promise.resolve(false);}
}
// первое касание страницы «будит» звук заранее
['touchend','click'].forEach(ev=>document.addEventListener(ev,function once(){document.removeEventListener(ev,once,true);try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state!=='running')AC.resume();const b=AC.createBuffer(1,1,22050),src=AC.createBufferSource();src.buffer=b;src.connect(AC.destination);src.start(0);}catch(e){}},true));
function tone(freq,dur=0.18,vol=0.25,delay=0,type='sine'){
  if(!AC) return; const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type;o.frequency.value=freq;const v=vol*SET.volume;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(v,0.0002),t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+0.05);
}
function say(text){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=1.15;u.volume=Math.min(1,SET.volume+0.2);const v=speechSynthesis.getVoices().find(v=>/^ru/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
const NUM=['','раз','два','три','четыре','пять','шесть','семь','восемь','девять','десять','одиннадцать','двенадцать'];
function metroTick(n,cur){

  if(n===1) return; // начало фазы уже отмечено звуком смены фазы
  tone(n%2?1500:1300,0.035,0.32,0,'square');
}

/* ================= ЭКРАН: ТЕОРИЯ ================= */
function renderTheory(){
  if($('#v-theory').dataset.ready) return;
  $('#v-theory').dataset.ready='1';
  $('#v-theory').innerHTML=`
  <h1 class="page-title">Теория</h1><p class="muted small" style="margin:-8px 4px 14px">Что такое прана, зачем работать с дыханием и как выполнять каждую технику программы.</p>

  <details open><summary>Что такое прана</summary><div class="body">
   <p><b>Прана</b> (санскр. «жизненная сила», от <i>пра</i> — «вперёд, наполнение» и <i>ан</i> — «дышать, жить») — в йоге так называют энергию, которая поддерживает жизнь. Она присутствует в воздухе, пище, солнечном свете, а главным её проводником считается дыхание.</p>
   <p><b>Пранаяма</b> = <i>прана</i> + <i>аяма</i> («расширение, управление»). Это практика сознательного управления дыханием: его ритмом, глубиной, задержками и тем, через какую ноздрю идёт воздух. В «Йога-сутрах» Патанджали пранаяма — четвёртая ступень восьмеричного пути, мост между телом (асаны) и умом (концентрация, медитация).</p>
   <p>По йогической традиции прана движется по тонким каналам — <b>нади</b>. Главные из них:</p>
   <ul>
     <li><b>Ида</b> — левый, «лунный» канал: охлаждение, покой, восстановление.</li>
     <li><b>Пингала</b> — правый, «солнечный»: активность, тепло, энергия.</li>
     <li><b>Сушумна</b> — центральный: равновесие, состояние ясного сосредоточения.</li>
   </ul>
   <p>Йога также выделяет пять потоков праны (вайю): <i>прана</i> (вдох, грудь), <i>апана</i> (выведение, низ живота), <i>самана</i> (усвоение, пупок), <i>удана</i> (речь, горло) и <i>вьяна</i> (распределение по всему телу).</p>
  </div></details>

  <details><summary>Зачем нужна дыхательная практика</summary><div class="body">
   <p>Дыхание — единственная автоматическая функция тела, которой можно управлять сознательно. Через него можно влиять на нервную систему, которая иначе нам не подчиняется.</p>
   <ul>
     <li><b>Медленное дыхание и удлинённый выдох</b> активируют парасимпатическую нервную систему (через блуждающий нерв): замедляется пульс, снижается тревожность, приходит расслабление.</li>
     <li><b>Ровный ритм</b> повышает вариабельность сердечного ритма — один из показателей устойчивости к стрессу.</li>
     <li><b>Задержки дыхания</b> мягко повышают переносимость углекислого газа; дыхание в обычной жизни становится спокойнее и экономнее.</li>
     <li><b>Счёт и наблюдение</b> за дыханием тренируют внимание — это подготовка к медитации.</li>
     <li><b>Регулярность</b> важнее интенсивности: 3–10 минут каждый день дают больше, чем час раз в неделю. Поэтому программа построена на 7-дневных уровнях.</li>
   </ul>
   <p class="muted small">Практика не заменяет лечение. При хронических заболеваниях посоветуйтесь с врачом.</p>
  </div></details>

  <details><summary>Как устроена программа</summary><div class="body">
   <ol>
     <li>Три техники по порядку: <b>квадратное дыхание → анулома-вилома → капалабхати</b>. В каждой 5 уровней.</li>
     <li>Чтобы перейти на следующий уровень, нужно <b>7 дней практики</b>. День засчитан, если завершена хотя бы одна полная сессия.</li>
     <li>Пропускать можно <b>не больше 1 дня подряд</b> (7 дней укладываются максимум в 14). Если пропущено 2 дня — счётчик дней обнуляется, но уровень сохраняется.</li>
     <li>Сложность растёт постепенно: сначала удлиняются задержки, потом вдохи и выдохи, затем начинается новая техника.</li>
     <li>За достижения выдаются медали — смотрите раздел «Медали».</li>
   </ol>
  </div></details>

  <details><summary>Общие правила и безопасность</summary><div class="body">
   <ul>
     <li>Практикуйте натощак или через 2–3 часа после еды, в проветренном помещении.</li>
     <li>Сидите с прямой спиной: на стуле, на подушке со скрещенными ногами или на пятках. Плечи и лицо расслаблены.</li>
     <li>Дышите носом, если в технике не сказано иное.</li>
     <li><b>Никакого напряжения.</b> Если задержка даётся тяжело, хочется «хватать» воздух, кружится голова или темнеет в глазах — остановитесь и подышите свободно. Лучше остаться на уровне подольше.</li>
     <li>Задержки дыхания и капалабхати <b>не выполняют</b> при беременности, высоком давлении, болезнях сердца, после недавних операций, при эпилепсии, глаукоме, отслоении сетчатки, острых состояниях. В этих случаях — только спокойное дыхание без задержек и консультация врача.</li>
     <li>Не практикуйте за рулём, в воде и в любых ситуациях, где важна полная концентрация на другом.</li>
   </ul>
  </div></details>

  <details><summary>1. Квадратное дыхание <span class="tag">сама вритти · box breathing</span></summary><div class="body">
   <p><b>Суть:</b> четыре равные фазы — вдох, задержка, выдох, пауза — как четыре стороны квадрата. В йоге похожий принцип называется <i>сама вритти</i> («равное движение»). Эту технику используют спортсмены, пилоты и спецподразделения для быстрого восстановления самообладания.</p>
   <h3>Как выполнять</h3>
   <ol>
     <li>Сядьте ровно, выдохните до конца.</li>
     <li>Вдох носом на счёт 4 — сначала наполняется живот, потом рёбра и грудь.</li>
     <li>Задержка на 4. Горло не зажимайте: воздух удерживается мягко, как будто вы просто «зависли» на вершине вдоха.</li>
     <li>Плавный выдох носом на 4.</li>
     <li>Пауза на 4 — спокойная, без усилия.</li>
   </ol>
   <h3>Польза</h3>
   <ul><li>Быстро снимает стресс и тревогу, выравнивает пульс.</li><li>Учит ровному ритму и счёту — основа всех следующих пранаям.</li><li>Мягко тренирует задержки.</li></ul>
   <h3>Уровни</h3>
   <p>4-4-4-4 → 4-5-4-5 → 4-6-4-6 → 5-6-5-6 → 6-6-6-6. Сначала растут задержки, потом вдох и выдох.</p>
   <h3>Частые ошибки</h3>
   <ul><li>Поднимаются плечи на вдохе.</li><li>Зажато горло во время задержки.</li><li>Выдох «сбрасывается» в первую секунду, а не растягивается на весь счёт.</li></ul>
  </div></details>

  <details><summary>2. Анулома-вилома <span class="tag">попеременное дыхание ноздрями</span></summary><div class="body">
   <p><b>Суть:</b> <i>анулома</i> — «по направлению», <i>вилома</i> — «против направления». Дыхание поочерёдно через левую и правую ноздрю. По традиции очищает и уравновешивает каналы ида и пингала. Близкая техника — нади шодхана («очищение каналов»); названия часто используют как синонимы.</p>
   <h3>Вишну-мудра (положение руки)</h3>
   <p>Правая рука: указательный и средний пальцы согнуты к ладони. Большой палец закрывает правую ноздрю, безымянный (с мизинцем) — левую. Левая рука спокойно лежит на колене.</p>
   <h3>Один цикл</h3>
   <ol>
     <li>Закройте правую ноздрю — <b>вдох левой</b>.</li>
     <li>Закройте обе — <b>задержка</b> (с 3-го уровня).</li>
     <li>Откройте правую — <b>выдох правой</b>.</li>
     <li><b>Вдох правой</b>.</li>
     <li>Закройте обе — <b>задержка</b>.</li>
     <li>Откройте левую — <b>выдох левой</b>.</li>
   </ol>
   <h3>Уровни (вдох – задержка – выдох)</h3>
   <p>4-0-4 (ровное дыхание, 1:1) → 4-0-8 (выдох вдвое длиннее, 1:2) → 4-4-8 (1:1:2) → 4-8-8 (1:2:2) → 5-10-10.</p>
   <h3>Польза</h3>
   <ul><li>Глубокое успокоение, баланс активности и отдыха.</li><li>Улучшает концентрацию, хорошо подходит перед медитацией и сном.</li><li>Удлинённый выдох особенно сильно включает расслабление.</li></ul>
   <h3>Важно</h3>
   <ul><li>Если нос заложен, сначала прочистите его; через силу не дышите.</li><li>Дыхание бесшумное и плавное, давление пальцами лёгкое.</li><li>Задержки — только без напряжения (см. «Безопасность»).</li></ul>
  </div></details>

  <details><summary>3. Капалабхати <span class="tag">«сияющий череп»</span></summary><div class="body">
   <p><b>Суть:</b> <i>капала</i> — «череп», <i>бхати</i> — «сияние». Формально это не пранаяма, а одна из шести очищающих практик (шаткарм). Короткие резкие выдохи за счёт мышц живота и пассивные вдохи. Бодрит, согревает, «проветривает» голову.</p>
   <h3>Как выполнять</h3>
   <ol>
     <li>Сядьте ровно, ладони на коленях. Сделайте глубокий вдох.</li>
     <li>Резкий короткий выдох носом: живот толчком уходит внутрь.</li>
     <li>Отпустите живот — вдох происходит сам, без усилия.</li>
     <li>Повторяйте в заданном темпе. Двигается только живот: плечи, грудь и лицо неподвижны.</li>
     <li>После раунда — полный выдох, затем 30 секунд спокойного дыхания и наблюдения за ощущениями.</li>
   </ol>
   <h3>Уровни (выдохов за раунд · темп)</h3>
   <p>20 × 1 в 2 с → 30 × 1 в 2 с → 40 × 1 в 1,5 с → 50 × 1 в 1 с → 60 × 1 в 1 с. Один цикл = один раунд.</p>
   <h3>Польза</h3>
   <ul><li>Бодрость и ясность, хорошо утром.</li><li>Тонус мышц пресса и диафрагмы.</li><li>Традиционно — очищение носовых ходов и дыхательных путей.</li></ul>
   <h3>Противопоказания</h3>
   <p>Беременность и менструация, гипертония, болезни сердца, грыжи (в том числе диафрагмальная), операции на животе и грудной клетке в последние месяцы, эпилепсия, глаукома, язва, острые воспаления. Не делайте перед сном и на полный желудок. При головокружении — остановитесь.</p>
  </div></details>

  <details><summary>Карта пранаям — что будет дальше</summary><div class="body">
   <ul>
     <li><b>Уджайи</b> — «победное» дыхание с лёгким сужением горла и мягким шумом; успокаивает, согревает, часто используется в асанах.</li>
     <li><b>Бхастрика</b> — «кузнечные мехи»: активные и вдох, и выдох; сильно энергизирует.</li>
     <li><b>Бхрамари</b> — «пчела»: выдох с гудением; снимает напряжение, помогает при бессоннице.</li>
     <li><b>Шитали / шиткари</b> — охлаждающие: вдох через свёрнутый язык или сквозь зубы.</li>
     <li><b>Сурья бхедана / чандра бхедана</b> — вдох только правой (активирует) или только левой (успокаивает) ноздрёй.</li>
     <li><b>Нади шодхана с кумбхакой</b> — попеременное дыхание с длинными задержками в пропорции 1:4:2.</li>
     <li><b>Когерентное дыхание</b> — около 6 вдохов-выдохов в минуту (5–5,5 с на фазу); выравнивает сердечный ритм.</li>
     <li><b>Дыхание 4-7-8</b> — вдох 4, задержка 7, выдох 8; для засыпания.</li>
   </ul>
  </div></details>`;
}

  $('#volume').oninput=e=>{SET.volume=+e.target.value;saveSet();};
  $('#testChime').onclick=async e=>{const b=e.currentTarget;if(b.disabled)return;b.disabled=true;b.textContent='Играет…';b.classList.add('primary');
    const ok=await chime(); if(!ok) toast('Звук не запустился. Проверьте громкость и беззвучный режим.');
    setTimeout(()=>{b.disabled=false;b.textContent='Проверить';b.classList.remove('primary');if(!R)playbackMode(false);},1800);};
  $('#remOn').onchange=async e=>{SET.remindersOn=e.target.checked;saveSet();if(SET.remindersOn&&'Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission();}catch(_){}}renderSettings();};
  document.querySelectorAll('#times input').forEach(inp=>inp.onchange=()=>{SET.reminders[+inp.dataset.i]=inp.value;saveSet();});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{SET.reminders.splice(+b.dataset.del,1);saveSet();renderSettings();});
  $('#addTime').onclick=()=>{SET.reminders.push('12:00');saveSet();renderSettings();};
  $('#testRem').onclick=async()=>{ensureAudio();if('Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission();}catch(_){}}fireReminder(true);renderSettings();};
  const ib=$('#installBtn'); if(ib) ib.onclick=async()=>{try{installEvt.prompt();await installEvt.userChoice;}catch(e){}installEvt=null;renderSettings();};
  $('#resetAll').onclick=()=>openModal(`<h2>Сбросить прогресс?</h2><p>Уровни, дни, история и медали будут удалены. Настройки сохранятся.</p>
     <div class="row" style="justify-content:center"><button class="btn" data-close>Отмена</button><button class="btn danger" id="confirmReset">Сбросить</button></div>`,
     ()=>{$('#confirmReset').onclick=()=>{S=structuredClone(DEF_STATE);saveS();closeModal();toast('Прогресс сброшен');showTab('practice');};});
}
let installEvt=null; window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(currentTab==='settings')renderSettings();});
function applyTheme(){ const light=SET.theme==='light'; if(light) document.documentElement.setAttribute('data-theme','light'); else document.documentElement.removeAttribute('data-theme'); const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=light?'#f5efe2':'#0a0e13'; }

/* ================= НАПОМИНАНИЯ ================= */
function fireReminder(test){
  const done=S.levelDays.includes(today());
  const body = done ? 'Сегодня уже засчитано. Можно подышать ещё пару минут для удовольствия.' :
    `${TECH[S.tech].name}, уровень ${S.level+1}. ${statusLine().cls==='warn'?'Сегодня обязательно — иначе счётчик обнулится!':'Пара минут — и день засчитан.'}`;
  let shown=false;
  if('Notification' in window && Notification.permission==='granted'){ try{ new Notification(test?'Проверка напоминания':'Время дышать 🌬️',{body, tag:'bw1'}); shown=true;}catch(e){} }
  if(!shown) openModal(`<h2>${test?'Проверка напоминания':'Время дышать 🌬️'}</h2><p>${body}</p><button class="btn primary" data-close>Хорошо</button>`);
  chime();
}
function checkReminders(){
  if(!SET.remindersOn) return;
  const d=nowDate(), hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'), t=today();
  let fired={}; try{fired=JSON.parse(localStorage.getItem(LS_REM))||{};}catch(e){}
  SET.reminders.forEach(r=>{ if(r===hm && fired[r]!==t){ fired[r]=t; fireReminder(false);} });
  try{localStorage.setItem(LS_REM,JSON.stringify(fired));}catch(e){}
}
setInterval(checkReminders,15000);

/* ================= СЕССИЯ ================= */
const ph=(k,d,label,nos)=>({k,d,label,nos});
function buildCycle(ti,lv,isLast){
  const L=TECH[ti].levels[lv];
  if(ti===0){const [a,b,c,d]=L;return [ph('inhale',a,'Вдох'),ph('hold',b,'Задержка'),ph('exhale',c,'Выдох'),ph('pause',d,'Пауза')].filter(p=>p.d>0);}
  if(ti===1){const [a,b,c]=L;return [ph('inhale',a,'Вдох левой','L'),ph('hold',b,'Задержка','-'),ph('exhale',c,'Выдох правой','R'),
    ph('inhale',a,'Вдох правой','R'),ph('hold',b,'Задержка','-'),ph('exhale',c,'Выдох левой','L')].filter(p=>p.d>0);}
  const [n,iv]=L, arr=[ph('prep',4,'Глубокий вдох')];
  for(let i=1;i<=n;i++) arr.push(Object.assign(ph('pump',iv,'Выдох'),{n:i,of:n}));
  arr.push(ph('exhale',3,'Полный выдох'));
  if(!isLast) arr.push(ph('rest',30,'Отдых'));
  return arr;
}
const ORB={ready:'--pause',inhale:'--inhale',prep:'--inhale',hold:'--hold',exhale:'--exhale',pause:'--pause',pump:'--pump',rest:'--rest'};
let R=null, wakeLock=null;
async function lockScreen(){try{if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
function unlockScreen(){try{wakeLock&&wakeLock.release();}catch(e){}wakeLock=null;}
document.addEventListener('visibilitychange',()=>{if(R&&!R.paused&&document.visibilityState==='visible')lockScreen();});

function startSession(){
  ensureAudio(); lockScreen();
  const ti=S.tech, lv=S.level, start=nowDate();
  R={ti,lv,mode:SET.mode,cycles:SET.cycles,limit:SET.minutes*60,cycle:0,queue:[ph('ready',3,'Приготовьтесь')],cur:null,
     phaseEl:0,practice:0,paused:false,last:performance.now(),startHour:start.getHours(),prevScale:0.55,lastSec:-1};
  if(R.mode==='cycles'){R.total=0;for(let i=1;i<=R.cycles;i++)R.total+=cycleDuration(ti,lv,i===R.cycles);}
  $('#sTech').textContent=`${TECH[ti].name} · ур. ${lv+1}`;
  $('#nostrils').hidden = ti!==1;
  $('#btnPause').textContent='Пауза';
  $('#sBar').style.width='0%';
  $('#session').classList.add('on');
  nextPhase(); requestAnimationFrame(frame);
}
function nextPhase(){
  if(!R.queue.length){
    if(R.mode==='cycles'){ if(R.cycle>=R.cycles){finishSession(true);return false;} R.cycle++; R.queue=buildCycle(R.ti,R.lv,R.cycle===R.cycles); }
    else { R.cycle++; R.queue=buildCycle(R.ti,R.lv,false); }
  }
  if(R.cur) R.prevScale=scaleFor(R.cur,1);
  R.cur=R.queue.shift(); R.lastSec=-1;
  const k=R.cur.k;
  if(SET.phaseSound){ if(k==='pump') tone(180,0.06,0.18,0,'triangle'); else if(PHASE_FREQ[k]) tone(PHASE_FREQ[k],0.25,0.22); }
  document.getElementById('session').style.setProperty('--orb',`var(${ORB[k]})`);
  $('#phaseLabel').textContent=R.cur.label;
  let sub='';
  if(k==='pump') sub=`из ${R.cur.of}`;
  else if(k==='ready') sub='Сядьте ровно, расслабьте плечи';
  else if(k==='hold'&&R.ti===1) sub='обе ноздри закрыты';
  else if(k==='rest') sub='Спокойное дыхание. Наблюдайте за ощущениями';
  $('#phaseSub').textContent=sub;
  if(R.ti===1){
    const L=$('#nosL'),Rn=$('#nosR'); L.className='nos';Rn.className='nos';
    const ex=k==='exhale'?' ex':'';
    if(R.cur.nos==='L'){L.className='nos on'+ex;Rn.className='nos off';}
    else if(R.cur.nos==='R'){Rn.className='nos on'+ex;L.className='nos off';}
    else if(R.cur.nos==='-'){L.className='nos off';Rn.className='nos off';}
  }
  return true;
}
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const MIN=0.55, MAX=1;
function scaleFor(c,p){
  switch(c.k){
    case 'inhale': case 'prep': return R.prevScale+(MAX-R.prevScale)*ease(p);
    case 'exhale': return R.prevScale-(R.prevScale-MIN)*ease(p);
    case 'hold': return R.prevScale;
    case 'pause': return R.prevScale;
    case 'pump': return p<.25 ? 0.86-0.16*(p/.25) : 0.70+0.16*((p-.25)/.75);
    case 'rest': return 0.72+0.06*Math.sin(p*c.d/6*Math.PI*2);
    default: return MIN;
  }
}
function fmtClock(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function frame(ts){
  if(!R) return;
  const dt=Math.min(5,(ts-R.last)/1000)*BW.speed; R.last=ts;
  if(!R.paused){
    R.phaseEl+=dt; if(R.cur.k!=='ready') R.practice+=dt;
    if(R.mode==='time' && R.practice>=R.limit){R.practice=R.limit;finishSession(true);return;}
    while(R.phaseEl>=R.cur.d){R.phaseEl-=R.cur.d; if(!nextPhase()) return;}
  }
  if(!R.paused && R.cur.k!=='pump'){
    const sec=Math.floor(R.phaseEl);
    if(sec!==R.lastSec){ R.lastSec=sec;
      if(R.cur.k==='rest'){ if(sec===0 && SET.metro==='voice') say('Отдых'); }
      else if(R.cur.k==='ready'){ if(SET.metro==='voice') say(['три','два','один'][sec]||''); else if(SET.metro==='click') tone(1300,0.035,0.3,0,'square'); }
      else metroTick(sec+1,R.cur);
    }
  }
  const p=Math.min(1,R.phaseEl/R.cur.d);
  const sc=scaleFor(R.cur,p), u=(sc-MIN)/(MAX-MIN);
  $('#orb').style.transform=`scale(${sc.toFixed(4)})`;
  $('#ring2').style.transform=`scale(${(0.66+0.34*u).toFixed(4)})`;
  $('#ring3').style.transform=`scale(${(0.74+0.26*u).toFixed(4)})`;
  $('#sBar').style.width=(Math.min(1,R.mode==='time'?R.practice/R.limit:R.practice/R.total)*100).toFixed(1)+'%';
  const left=R.cur.k==='pump'?R.cur.n:Math.ceil(R.cur.d-R.phaseEl);
  $('#orbNum').textContent=left;
  if(R.mode==='time') $('#sProgress').textContent=`Осталось ${fmtClock(R.limit-R.practice)}`;
  else $('#sProgress').textContent=R.cur.k==='ready'?`${R.cycles} ${plural(R.cycles,'цикл','цикла','циклов')}`:`Цикл ${R.cycle} из ${R.cycles} · ${fmtClock(R.total-R.practice)}`;
  requestAnimationFrame(frame);
}
$('#btnPause').onclick=()=>{ if(!R) return; R.paused=!R.paused; $('#btnPause').textContent=R.paused?'Продолжить':'Пауза'; $('#phaseSub').textContent=R.paused?'Пауза':''; if(R.paused)unlockScreen();else lockScreen(); };
$('#btnStop').onclick=()=>{
  if(!R) return; const was=R.paused; R.paused=true;
  openModal(`<h2>Прервать сессию?</h2><p>Незавершённая сессия не засчитывается.</p>
   <div class="row" style="justify-content:center"><button class="btn" id="contS">Продолжить</button><button class="btn danger" id="quitS">Прервать</button></div>`,
   ()=>{$('#contS').onclick=()=>{closeModal();if(R){R.paused=was;R.last=performance.now();}};$('#quitS').onclick=()=>{closeModal();finishSession(false);};});
};
function finishSession(completed){
  const r=R; R=null; unlockScreen(); setTimeout(()=>{if(!R)playbackMode(false);},4000);
  $('#session').classList.remove('on');
  if(!completed){toast('Сессия прервана');render();return;}
  chime();
  const res=completeSession(r.practice, r.startHour);
  let lv='';
  if(res.levelUp){
    if(res.levelUp.all) lv=`<p><b>🎉 Вся программа пройдена!</b> Вы освоили ${TECH[res.levelUp.fromTech].name}.</p>`;
    else if(res.levelUp.newTech) lv=`<p><b>🎉 Техника освоена!</b> Дальше — ${TECH[S.tech].name}. Загляните в «Теорию» перед началом.</p>`;
    else lv=`<p><b>🎉 Новый уровень: ${S.level+1}!</b> Ритм: ${TECH[S.tech].fmt(TECH[S.tech].levels[S.level])}</p>`;
  }else if(res.dayCounted){ lv=`<p>День засчитан: <b>${S.levelDays.length} из 7</b>.</p>`; }
  else if(!S.finished){ lv=`<p class="muted">Сегодняшний день уже был засчитан ранее. Отличная дополнительная практика!</p>`; }
  const medals=res.fresh.length?`<h3 style="margin-top:14px">Новые медали</h3><div class="newmedals">${res.fresh.map(id=>{const m=medalById(id);return `<div>${coinHTML(m,true)}<div class="small"><b>${m.name}</b></div></div>`;}).join('')}</div>`:'';
  confetti(!!(res.levelUp||res.fresh.length));
  openModal(`<div class="done-ic">✓</div><h2>Сессия завершена</h2><p class="muted">Длительность ${fmtClock(r.practice)}</p>${lv}${medals}<button class="btn primary" data-close>Отлично</button>`,()=>bindCoins($('#modalBox')));
  render();
}

/* ================= КОНФЕТТИ ================= */
function confetti(big){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c);
  const x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=['#2fd3c0','#ffd25a','#ff6fb1','#b06bff','#ff9a3c','#f3f0e7','#3a8ef0'], N=big?170:80;
  const ps=Array.from({length:N},()=>({x:W/2+(Math.random()-.5)*W*.5,y:H*.4,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,r:Math.random()*7+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6.28,va:(Math.random()-.5)*.5}));
  const t0=performance.now();
  (function f(t){const e=(t-t0)/1000;x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.36;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=Math.max(0,1-e/3.2);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/3,p.r,p.r*.6);x.restore();});
    if(e<3.2) requestAnimationFrame(f); else c.remove();})(t0);
}

/* ================= ПРИВЕТСТВИЕ ================= */
function onboarding(){
  const slides=[
   {c:'#2fd3c0',art:`<div class="o" style="width:210px;height:210px;opacity:.14"></div><div class="o" style="width:150px;height:150px;opacity:.25;animation-delay:.15s"></div><div class="o" style="width:92px;height:92px;box-shadow:0 0 60px #2fd3c0;animation-delay:.3s"></div>`,
    h:'Дыши осознанно',p:'Несколько минут в день — и больше спокойствия, энергии и ясности в голове.'},
   {c:'#b06bff',art:[0,1,2].map(i=>`<div style="width:92px;height:92px;border-radius:24px;background:#161e28;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12)"><div style="width:62px">${techArt(i)}</div></div>`).join(''),
    h:'Программа шаг за шагом',p:'Три техники по 5 уровней. Каждый уровень — 7 дней практики. Сложность растёт постепенно.'},
   {c:'#ffb02e',art:['first','panther','dragon'].map((id,i)=>`<div style="width:${i===1?118:86}px">${medalSVG(medalById(id))}</div>`).join(''),
    h:'Собирай медали',p:'За регулярность и достижения. Не пропускай больше одного дня подряд — и переходи на новый уровень.'}];
  let i=0; const el=document.createElement('div'); el.id='onb'; document.body.appendChild(el);
  const done=()=>{SET.onboarded=true;saveSet();el.remove();};
  const draw=()=>{const s=slides[i]; el.style.setProperty('--oc',s.c);
    el.innerHTML=`<div class="bgl"></div><button class="skip">Пропустить</button>
     <div class="slide"><div class="art">${s.art}</div><h2>${s.h}</h2><p>${s.p}</p></div>
     <div class="ft"><div class="dotsn">${slides.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><button class="next">${i<slides.length-1?'Далее':'Начать'}</button></div>`;
    el.querySelector('.skip').onclick=done;
    el.querySelector('.next').onclick=()=>{ if(i<slides.length-1){i++;draw();} else done(); };};
  draw();
}

/* ================= МОДАЛКА / ТОСТ ================= */
function openModal(html,after){$('#modalBox').innerHTML=html;$('#modal').classList.add('on');$('#modalBox').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);if(after)after();}
function closeModal(){$('#modal').classList.remove('on');}
$('#modal').onclick=e=>{if(e.target.id==='modal'&&!R)closeModal();};
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2600);}

/* ================= СТАРТ ================= */
BW.state=()=>S; BW.complete=completeSession; BW.render=render; BW.reset=()=>{S=structuredClone(DEF_STATE);saveS();render();};
applyTheme();
render();
if(!SET.onboarded) onboarding();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!R)render();});
})();
</script>
